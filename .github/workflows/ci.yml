name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # Windows is the platform most users are on, so it is built here rather
    # than discovered to be broken at tag time.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: pnpm
          install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies for Tauri
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ffmpeg is what the batch smoke tests encode against; without it they
      # skip themselves and the argument strings go unverified.
      - name: Install FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install ffmpeg -y --no-progress

      - name: Svelte/TypeScript check
        run: pnpm check

      - name: Frontend tests
        run: pnpm test

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lints
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # This catches failures that compile-time checks cannot see, such as a
      # Tauri plugin being initialized without its required configuration.
      - name: Build Windows startup smoke binary
        if: matrix.platform == 'windows-latest'
        run: pnpm tauri build --no-bundle

      - name: Verify the Windows application starts
        if: matrix.platform == 'windows-latest'
        run: pnpm smoke:startup -- src-tauri/target/release/quick-media-organizer.exe
