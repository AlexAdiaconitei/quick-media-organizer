name: Release

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0 or 0.2.1-alpha.1"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        type: boolean
        default: false

jobs:
  # Resolves one version for every later job: it must match package.json,
  # Cargo.toml and tauri.conf.json, and CHANGELOG.md must describe it.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      base_version: ${{ steps.metadata.outputs.base_version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_notes: ${{ steps.metadata.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: false
          install: false

      - name: Resolve the release metadata
        id: metadata
        run: pnpm verify:release "${{ inputs.version || github.ref_name }}" "${{ inputs.prerelease || 'false' }}"

  release:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges each platform into latest.json. Serial builds stop
      # two jobs from reading and overwriting that asset at the same time.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target_dir: aarch64-apple-darwin
            executable: src-tauri/target/aarch64-apple-darwin/release/quick-media-organizer
          - platform: windows-latest
            args: ""
            target_dir: ""
            executable: src-tauri/target/release/quick-media-organizer.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target (macOS ARM)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # A prerelease such as 0.2.1-alpha.1 keeps its base version in the
      # project files, so the built application takes the full version from
      # this generated config instead.
      - name: Configure the release version
        env:
          RELEASE_CONFIG_PATH: src-tauri/tauri.release.conf.json
        run: pnpm verify:release "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.prerelease }}"

      - name: Fetch FFmpeg for bundling
        run: pnpm fetch-ffmpeg

      # The endpoint follows whichever repository is building, so a fork
      # updates from its own releases. Without signing secrets this writes
      # nothing and the build simply ships without the in-app updater.
      - name: Configure the updater
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/updater-config.mjs
          if [ -f src-tauri/tauri.updater.conf.json ]; then
            echo "config=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release binary before publishing
        run: pnpm tauri build --no-bundle ${{ matrix.args }} --config src-tauri/tauri.bundled-ffmpeg.conf.json --config src-tauri/tauri.release.conf.json ${{ steps.updater.outputs.config }}

      - name: Verify the release application starts
        run: pnpm smoke:startup "${{ matrix.executable }}"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: ${{ needs.validate.outputs.release_name }}
          releaseDraft: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          releaseBody: |
            Keyboard-first desktop app to rename, sort, trim and clean up phone photo & video backups.

            ${{ needs.validate.outputs.release_notes }}

            ## Which download?

            **Standard** — FFmpeg included. Trimming and batch optimizing work
            straight after install, nothing else to set up.

            Signed builds that include `latest.json` check for updates from
            this repository. Other builds link to the releases page instead.

            **Lite** (`-lite` in the file name) — same app, ~50 MB smaller,
            without FFmpeg. Renaming and organizing work as they are; trimming
            and batch optimizing need FFmpeg on your PATH:

            - Windows: `winget install Gyan.FFmpeg`
            - macOS: `brew install ffmpeg`

            Install it, reopen the app, and the trim and batch panels light up.

            ### macOS (Apple Silicon)
            Download the `.dmg`, open it, drag the app to Applications.

            **First launch:** if macOS warns about an unidentified developer, right-click → Open → confirm once.

            ### Windows
            Download the `.msi` or setup `.exe` and run the installer.

            **SmartScreen:** click *More info* → *Run anyway* if needed.

            ### FFmpeg licensing
            The bundled FFmpeg is GPL-licensed and stays a separate program,
            invoked as a subprocess; the app itself is MIT. See
            FFMPEG-LICENSE.txt next to the installed app.
          uploadUpdaterJson: ${{ steps.updater.outputs.enabled }}
          args: ${{ matrix.args }} --config src-tauri/tauri.bundled-ffmpeg.conf.json --config src-tauri/tauri.release.conf.json ${{ steps.updater.outputs.config }}

      # The Rust binary is already built, so this only repeats the bundling
      # step, without the FFmpeg payload.
      - name: Build the lite installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.args }} --config src-tauri/tauri.release.conf.json ${{ steps.updater.outputs.config }}

      - name: Upload the lite installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          if [ -n "${{ matrix.target_dir }}" ]; then
            bundle_dir="src-tauri/target/${{ matrix.target_dir }}/release/bundle"
          fi

          shopt -s nullglob
          uploads=()
          for file in "$bundle_dir"/*/*.dmg "$bundle_dir"/*/*.msi "$bundle_dir"/*/*.exe; do
            extension="${file##*.}"
            renamed="${file%.*}-lite.${extension}"
            mv "$file" "$renamed"
            uploads+=("$renamed")
          done

          if [ ${#uploads[@]} -eq 0 ]; then
            echo "No lite bundles were produced in $bundle_dir" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${uploads[@]}" --clobber

  publish:
    needs: [validate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Verify every installer before publishing
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"

          require_standard() {
            local extension="$1"
            if ! printf '%s\n' "$assets" | grep -Ei "\\.${extension}$" | grep -Eiv -- '-lite\.' >/dev/null; then
              echo "Missing standard .${extension} installer" >&2
              exit 1
            fi
          }

          require_lite() {
            local extension="$1"
            if ! printf '%s\n' "$assets" | grep -Ei -- "-lite\\.${extension}$" >/dev/null; then
              echo "Missing lite .${extension} installer" >&2
              exit 1
            fi
          }

          require_standard msi
          require_standard exe
          require_standard dmg
          require_lite msi
          require_lite exe
          require_lite dmg

          if [ -n "$TAURI_SIGNING_PUBLIC_KEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            work_dir="${RUNNER_TEMP}/qmo-release-assets"
            mkdir -p "$work_dir"
            gh release download "$RELEASE_TAG" --pattern latest.json --dir "$work_dir"
            jq -e \
              '.platforms["windows-x86_64"] and .platforms["darwin-aarch64"]' \
              "$work_dir/latest.json" >/dev/null
          elif [ -n "$TAURI_SIGNING_PUBLIC_KEY" ] || [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Updater signing configuration is incomplete" >&2
            exit 1
          fi

      # A prerelease must never become the "latest" release: the updater
      # endpoint reads latest.json from there.
      - name: Publish the verified release
        shell: bash
        env:
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
