[package]
name = "quick-media-organizer"
version = "0.2.0"
description = "Organize photo and video folders quickly with keyboard shortcuts"
authors = ["Ferran Vidal Bellés"]
edition = "2021"

[lib]
name = "quick_media_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"
kamadak-exif = "0.6"
rayon = "1"
walkdir = "2"
img-parts = "0.4.0"

# Updating is desktop-only; mobile stores handle their own updates.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
